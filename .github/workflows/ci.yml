name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: coopgestion
          POSTGRES_PASSWORD: coopgestion_ci
          POSTGRES_DB: coopgestion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coopgestion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Apuntan a la base del servicio, así scripts/db.mjs no intenta levantar la base local.
      DATABASE_URL: postgres://coopgestion:coopgestion_ci@localhost:5432/coopgestion_test
      TEST_DATABASE_URL: postgres://coopgestion:coopgestion_ci@localhost:5432/coopgestion_test
      JWT_SECRET: clave-solo-para-ci-no-usar-en-ningun-otro-lado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Falla si la cobertura del motor de cálculo baja del 95 %.
      - run: npm run test:motor
      - run: npm run build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
