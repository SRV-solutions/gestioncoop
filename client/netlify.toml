# Frontend en Netlify (sitio estático + CDN). En Netlify: Base directory = client.
# Netlify redirige /api/* a la API en Railway: el navegador ve un solo dominio,
# las cookies httpOnly funcionan sin configuración entre sitios y no hace falta CORS.
# Definir API_URL en Netlify (https://<servicio>.up.railway.app): el build genera dist/_redirects con esa URL.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: todas las rutas las resuelve React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Assets con hash: caché de 1 año.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML siempre fresco para que las actualizaciones lleguen al instante.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Sin scripts de terceros. Lo único externo es el mapa: teselas de OpenFreeMap y relieve de AWS Open Data.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://s3.amazonaws.com; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://s3.amazonaws.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self)"
